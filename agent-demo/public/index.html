<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Scatter Map Demo</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        #chat-history { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 20px; }
        .message { margin-bottom: 10px; padding: 8px; border-radius: 5px; }
        .user { background-color: #e3f2fd; text-align: right; }
        .agent { background-color: #f5f5f5; }
        #input-area { display: flex; gap: 10px; }
        input { flex-grow: 1; padding: 10px; }
        button { padding: 10px 20px; }
        img { max-width: 100%; border: 1px solid #ddd; margin-top: 5px; }
        .loading { color: #888; font-style: italic; }
    </style>
</head>
<body>
    <h1>Smart Map Agent</h1>
    <div id="chat-history"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Try: 'Render a scatter map with 200 points'">
        <button onclick="sendMessage()">Send</button>
    </div>

    <script>
        const chatHistory = document.getElementById('chat-history');
        const userInput = document.getElementById('user-input');

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Add user message
            appendMessage('user', text);
            userInput.value = '';

            // Add loading indicator
            const loadingId = appendMessage('agent', 'Thinking...', true);

            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();
                
                // Remove loading
                document.getElementById(loadingId).remove();

                if (data.error) {
                    appendMessage('agent', 'Error: ' + data.error);
                } else {
                    appendMessage('agent', data.reply);
                    if (data.image) {
                        appendImage(data.image);
                    }
                }
            } catch (e) {
                document.getElementById(loadingId).remove();
                appendMessage('agent', 'Network Error: ' + e.message);
            }
        }

        function appendMessage(role, text, isLoading = false) {
            const div = document.createElement('div');
            div.className = `message ${role} ${isLoading ? 'loading' : ''}`;
            div.textContent = text;
            const id = 'msg-' + Date.now();
            div.id = id;
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
            return id;
        }

        function appendImage(base64) {
            const div = document.createElement('div');
            div.className = 'message agent';
            const img = document.createElement('img');
            img.src = `data:image/png;base64,${base64}`;
            div.appendChild(img);
            chatHistory.appendChild(div);
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
